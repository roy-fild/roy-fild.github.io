<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지역별 59/84 투자금 테이블</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 16px
        }
        
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
            margin-bottom: 12px
        }
        
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px
        }
        
        label {
            font-size: 12px;
            color: #444
        }
        
        select,
        input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px
        }
        
        button {
            padding: 9px 12px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: #fff;
            cursor: pointer
        }
        
        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }
        
        table {
            border-collapse: collapse;
            width: 100%
        }
        
        th,
        td {
            border: 1px solid #e5e5e5;
            padding: 8px 10px;
            font-size: 13px
        }
        
        th {
            position: sticky;
            top: 0;
            background: #fafafa;
            z-index: 1
        }
        
        td.num,
        th.num {
            text-align: right;
            font-variant-numeric: tabular-nums
        }
        
        td.key {
            font-weight: 600
        }
        
        .hint {
            color: #666;
            font-size: 12px;
            margin: 6px 0 14px
        }
        
        .chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #f2f2f2;
            font-size: 12px;
            color: #333
        }
        /* 투자금 셀 공통 */
        
        .inv-cell {
            font-weight: 600;
            border-radius: 6px;
        }
        /* 배경만 강조, 글자는 기본색 유지 */
        
        .inv59-bg {
            background-color: rgba(13, 110, 253, 0.12);
            /* 기본 연파랑 */
        }
        
        .inv84-bg {
            background-color: rgba(111, 66, 193, 0.12);
            /* 기본 연보라 */
        }


        #tbl tbody tr { cursor: pointer; }
        #tbl tbody tr:hover { background:#fafcff; }
        #tbl tbody tr.selected-row { outline:2px solid #111; outline-offset:-2px; }

        .segmented {
            display:flex; border:1px solid #ccc; border-radius:9px; overflow:hidden; height:36px;
        }
        .segmented button {
            border-radius:0; background:#fff; color:#333; padding:7px 14px; border-right:1px solid #ddd;
        }
        .segmented button:last-child { border-right:0; }
        .segmented button.active { background:#111; color:#fff; }

        .trend-drawer {
            position:fixed; left:0; right:0; bottom:0; z-index:50;
            background:#fff; border-top:1px solid #ddd; box-shadow:0 -10px 30px rgba(0,0,0,.14);
            transform:translateY(105%); transition:transform .25s ease;
            max-height:70vh; overflow:auto;
        }
        .trend-drawer.open { transform:translateY(0); }
        .trend-inner { max-width:1200px; margin:0 auto; padding:16px 18px 20px; }
        .trend-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:10px; }
        .trend-title { font-size:18px; font-weight:750; }
        .trend-sub { font-size:12px; color:#666; margin-top:3px; }
        .trend-close { background:#f2f2f2; color:#222; padding:7px 10px; }
        .trend-stats { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; }
        .stat-card { border:1px solid #eee; border-radius:10px; padding:8px 10px; min-width:130px; }
        .stat-label { font-size:11px; color:#777; }
        .stat-value { font-size:15px; font-weight:700; margin-top:2px; }
        .chart-wrap { height:300px; }
        @media (max-width:700px) { .chart-wrap { height:250px; } }

    </style>
</head>

<body>
    <h2 style="margin:0 0 6px;">지역별 59/84 투자금
        <span style="font-size:14px; font-weight:500; color:#444;">
      (업데이트: <span id="updateDate">-</span>) by 필디
        </span>
    </h2>

    <div class="hint">
        조회 조건: <span class="chip">region(시/도)</span> + <span class="chip">면적 59/84 선택</span> + <span class="chip">선택 면적 투자금 범위</span> · 행 클릭 시 과거 추이
    </div>

    <div class="toolbar">
        <div class="field">
            <label for="regionSel">region(시/도) 선택</label>
            <select id="regionSel"></select>
        </div>

        <div class="field">
            <label>투자금 기준 면적</label>
            <div class="segmented" id="sizeSeg">
                <button type="button" class="active" data-size="59">59</button>
                <button type="button" data-size="84">84</button>
            </div>
        </div>

        <div class="field">
            <label for="minInv"><span id="minLabelSize">59</span> 투자금 최소</label>
            <input id="minInv" type="number" inputmode="numeric" placeholder="예) 30000" />
        </div>

        <div class="field">
            <label for="maxInv"><span id="maxLabelSize">59</span> 투자금 최대</label>
            <input id="maxInv" type="number" inputmode="numeric" placeholder="예) 80000" />
        </div>

        <div class="field" style="min-width:160px;">
            <label>&nbsp;</label>
            <button id="applyBtn" disabled>적용</button>
        </div>
        <div class="field" style="min-width:160px;">
            <label>&nbsp;</label>
            <button id="excelBtn" disabled style="margin-left:8px;">Excel 다운로드</button>
        </div>
    </div>

    <div id="status" class="hint">CSV 로딩 중…</div>

    <div style="overflow:auto; border:1px solid #eee; border-radius:12px;">
        <table id="tbl">
            <thead>
                <tr>
                    <th class="num">순번</th>
                    <th class="num">지역</th>
                    <th>시/구</th>
                    <th class="num">인구수</th>
                    <th class="num">매매(평당)</th>
                    <th class="num">전세(평당)</th>
                    <th class="num">전세가율</th>
                    <th class="num">59매매가</th>
                    <th class="num">59전세가</th>
                    <th class="num">84매매가</th>
                    <th class="num">84전세가</th>
                    <th class="num">59투자금</th>
                    <th class="num">84투자금</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="trendDrawer" class="trend-drawer" aria-hidden="true">
        <div class="trend-inner">
            <div class="trend-head">
                <div>
                    <div id="trendTitle" class="trend-title">지역 투자금 추이</div>
                    <div id="trendSub" class="trend-sub">과거 CSV 데이터를 불러오는 중…</div>
                </div>
                <button id="trendClose" class="trend-close" type="button">닫기 ✕</button>
            </div>
            <div id="trendStats" class="trend-stats"></div>
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
        </div>
    </div>

    <script>
        (() => {
            // GitHub Pages에 올린 CSV 파일 이름 규칙: month_price_yyyymmdd.csv
            const PAGES_BASE = "https://roy-fild.github.io/file/price/";
            // 폴더에서 최신 파일을 찾기 위한 GitHub Contents API (공개 레포 기준)
            const GH_API = "https://api.github.com/repos/roy-fild/roy-fild.github.io/contents/file/price";

            let rows = [];
            let lastFiltered = [];
            let selectedSize = "59";
            let trendChart = null;
            let csvFileIndex = [];
            const historyCache = new Map();

            function invBgColor(val, type) {
                if (!Number.isFinite(val) || val <= 0) {
                    return "#f5f5f5"; // 투자금 없으면 연회색
                }

                const MAX = 50000; // 데이터 기준 최대 투자금 (조정 가능)
                const ratio = Math.min(val / MAX, 1);

                if (type === "59") {
                    // 파랑 계열
                    return `rgba(13,110,253,${0.15 + ratio * 0.55})`;
                } else {
                    // 보라 계열
                    return `rgba(111,66,193,${0.15 + ratio * 0.55})`;
                }
            }


            function stripParenNum(s) {
                return ((s !== undefined && s !== null) ? s : "")
                    .toString()
                    .replace(/\s*\(\d+\)\s*/g, "")
                    .trim();
            }

            function normKey(k) {
                // BOM/공백 제거 + 소문자
                return (k || "").toString().replace(/^\uFEFF/, "").replace(/\s/g, "").toLowerCase();
            }

            function getField(row, aliases) {
                // aliases: ["area","시/구", ...] 같은 후보 리스트
                if (!row) return "";
                const keys = Object.keys(row);
                for (let i = 0; i < aliases.length; i++) {
                    const a = normKey(aliases[i]);
                    for (let j = 0; j < keys.length; j++) {
                        const kk = normKey(keys[j]);
                        if (kk === a) {
                            const v = row[keys[j]];
                            return (v !== undefined && v !== null) ? v : "";
                        }
                    }
                }
                // 느슨한 매칭(포함)까지 한 번 더
                for (let i = 0; i < aliases.length; i++) {
                    const a = normKey(aliases[i]);
                    for (let j = 0; j < keys.length; j++) {
                        const kk = normKey(keys[j]);
                        if (kk.indexOf(a) >= 0) {
                            const v = row[keys[j]];
                            return (v !== undefined && v !== null) ? v : "";
                        }
                    }
                }
                return "";
            }

            function getRegion(row) {
                // CSV: region (시/도)
                return getField(row, ["region", "지역", "시도", "시/도"]).toString().trim();
            }

            function getArea(row) {
                // CSV: area (시/구)
                return stripParenNum(getField(row, ["area", "지역.1", "시/구", "시구"]).toString());
            }

            function toNum(v) {
                if (v === null || v === undefined) return NaN;
                const s = ("" + v).trim();
                if (!s) return NaN;
                const cleaned = s.replace(/,/g, "").replace(/%/g, "");
                const n = Number(cleaned);
                return Number.isFinite(n) ? n : NaN;
            }

            function fmt(n) {
                if (n === null || n === undefined || Number.isNaN(n)) return "";
                return Math.round(n).toLocaleString("en-US");
            }

            function fmtPct(v) {
                const s = ((v !== undefined && v !== null) ? v : "").toString().trim();
                if (!s) return "";
                if (s.indexOf("%") >= 0) return s;
                const n = toNum(s);
                return Number.isFinite(n) ? (n + "%") : s;
            }

            function downloadExcel() {
                if (!lastFiltered || !lastFiltered.length) {
                    alert("다운로드할 데이터가 없어요. 먼저 조건을 적용해 주세요.");
                    return;
                }

                const region = $("#regionSel").val();
                const minInv = toNum($("#minInv").val());
                const maxInv = toNum($("#maxInv").val());

                const data = lastFiltered.map(r => ({
                    "지역": getRegion(r),
                    "시/구": r._area,
                    "인구수": toNum(getField(r, ["people", "인구수", "인구"])),
                    "매매(평당)": r._c.mm,
                    "전세(평당)": r._c.js,
                    "전세가율": fmtPct(getField(r, ["전세가율", "전세가율(%)", "rate"])),
                    "59매매가": r._c.m59,
                    "59전세가": r._c.j59,
                    "84매매가": r._c.m84,
                    "84전세가": r._c.j84,
                    "59투자금": r._c.inv59,
                    "84투자금": r._c.inv84
                }));

                const ws = XLSX.utils.json_to_sheet(data, { cellDates: false });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "filtered");

                const dot = ($("#updateDate").text() || "").replace(/\./g, "");
                const minTxt = Number.isFinite(minInv) ? minInv : "";
                const maxTxt = Number.isFinite(maxInv) ? maxInv : "";
                const safeRegion = (region || "전체").replace(/[\\/:*?"<>|]/g, "_");

                const filename =
                    `month_price_${dot || "latest"}_${safeRegion}_min${minTxt}_max${maxTxt}.xlsx`;

                XLSX.writeFile(wb, filename);
            }


            function yyyymmddToDot(yyyymmdd) {
                if (!yyyymmdd || yyyymmdd.length !== 8) return "";
                const y = yyyymmdd.slice(0, 4);
                const m = yyyymmdd.slice(4, 6);
                const d = yyyymmdd.slice(6, 8);
                return y + "." + m + "." + d;
            }

            function compute(r) {
                // CSV 컬럼: 매매, 전세 (한글 그대로)
                const mm = toNum(getField(r, ["매매", "sale", "price"]));
                const js = toNum(getField(r, ["전세", "rent", "lease"]));
                const m59 = mm * 24;
                const j59 = js * 24;
                const m84 = mm * 34;
                const j84 = js * 34;
                const inv59 = m59 - j59;
                const inv84 = m84 - j84;
                return {
                    mm,
                    js,
                    m59,
                    j59,
                    m84,
                    j84,
                    inv59,
                    inv84
                };
            }

            function passesInvRange(inv59, inv84, minV, maxV) {
                const hasMin = Number.isFinite(minV);
                const hasMax = Number.isFinite(maxV);
                if (!hasMin && !hasMax) return true;
                const x = selectedSize === "84" ? inv84 : inv59;
                if (!Number.isFinite(x)) return false;
                if (hasMin && x < minV) return false;
                if (hasMax && x > maxV) return false;
                return true;
            }

            function render() {
                const region = $("#regionSel").val();
                const minInv = toNum($("#minInv").val());
                const maxInv = toNum($("#maxInv").val());

                const filtered = rows
                    .filter(function(r) {
                        return (region === "전체") ? true : (getRegion(r) === region);
                    })
                    .map(function(r) {
                        const c = compute(r);
                        const out = {};
                        for (const k in r) out[k] = r[k];
                        out._c = c;
                        out._area = getArea(r);
                        return out;
                    })
                    .filter(function(r) {
                        return passesInvRange(r._c.inv59, r._c.inv84, minInv, maxInv);
                    })
                    .sort(function(a, b) {
                        const av = selectedSize === "84" ? a._c.inv84 : a._c.inv59;
                        const bv = selectedSize === "84" ? b._c.inv84 : b._c.inv59;
                        return bv - av;
                    });

                lastFiltered = filtered;

                const $tb = $("#tbl tbody").empty();
                for (let i = 0; i < filtered.length; i++) {
                    const r = filtered[i];

                    const pop = fmt(toNum(getField(r, ["people", "인구수", "인구"])));
                    // const dem = fmt(toNum(getField(r, ["수요", "demand"])));
                    const mm = fmt(r._c.mm);
                    const js = fmt(r._c.js);

                    const tr = $("<tr/>");
                    tr.attr("title", "클릭하면 투자금 추이를 봅니다");
                    tr.on("click", function() {
                        $("#tbl tbody tr").removeClass("selected-row");
                        tr.addClass("selected-row");
                        openTrend(getRegion(r), r._area);
                    });
                    
                    tr.append($("<td class='num'/>").text(i + 1));

                    tr.append(
                        $("<td/>")
                        .text(getRegion(r))
                        .css({
                            color: "#666",
                            fontSize: "12px"
                        })
                    );
                    tr.append($("<td class='key'/>").text(r._area));
                    tr.append($("<td class='num'/>").text(pop));
                    // tr.append($("<td class='num'/>").text(dem));
                    tr.append($("<td class='num'/>").text(mm));
                    tr.append($("<td class='num'/>").text(js));
                    tr.append($("<td class='num'/>").text(fmtPct(getField(r, ["전세가율", "전세가율(%)", "rate"]))));

                    tr.append($("<td class='num'/>").text(fmt(r._c.m59)));
                    tr.append($("<td class='num'/>").text(fmt(r._c.j59)));
                    tr.append($("<td class='num'/>").text(fmt(r._c.m84)));
                    tr.append($("<td class='num'/>").text(fmt(r._c.j84)));
                    tr.append(
                        $("<td class='num inv-cell inv59-bg'/>")
                        .text(fmt(r._c.inv59))
                        .css("background-color", invBgColor(r._c.inv59, "59"))
                    );

                    tr.append(
                        $("<td class='num inv-cell inv84-bg'/>")
                        .text(fmt(r._c.inv84))
                        .css("background-color", invBgColor(r._c.inv84, "84"))
                    );
                    $tb.append(tr);
                }

                $("#status").text("총 " + filtered.length.toLocaleString("en-US") + "건 표시 중 (" + (region === "전체" ? "전체" : ("region: " + region)) + ", " + selectedSize + "㎡형 투자금 기준)");
            }

            function initUI() {
                const regions = [];
                const seen = {};
                for (let i = 0; i < rows.length; i++) {
                    const v = getRegion(rows[i]);
                    if (v && !seen[v]) {
                        seen[v] = true;
                        regions.push(v);
                    }
                }
                regions.sort();

                const $sel = $("#regionSel").empty();
                $sel.append($("<option/>").val("전체").text("전체"));
                for (let i = 0; i < regions.length; i++) {
                    $sel.append($("<option/>").val(regions[i]).text(regions[i]));
                }

                const defaultVal = "전체";
                $sel.val(defaultVal);

                $("#applyBtn").prop("disabled", false);
                $("#applyBtn").on("click", render);

                $("#excelBtn").prop("disabled", false);
                $("#excelBtn").on("click", downloadExcel);
                $("#regionSel").on("change", render);
                $("#sizeSeg button").on("click", function() {
                    selectedSize = $(this).data("size").toString();
                    $("#sizeSeg button").removeClass("active");
                    $(this).addClass("active");
                    $("#minLabelSize,#maxLabelSize").text(selectedSize);
                    render();
                });
                $("#minInv,#maxInv").on("keydown", function(e) {
                    if (e.key === "Enter") render();
                });

                render();
            }

   async function resolveLatestCsv() {

    const res = await fetch(GH_API + `?t=${Date.now()}`, {
        method: "GET",
        cache: "no-store"
    });

    if (!res.ok) {
        throw new Error("GitHub 파일 목록 조회 실패");
    }

    const files = await res.json();

    const csvFiles = files
        .filter(f => /^month_price_\d{8}\.csv$/.test(f.name))
        .map(f => {
            const match = f.name.match(/^month_price_(\d{8})\.csv$/);

            return {
                name: f.name,
                yyyymmdd: match[1]
            };
        })
        .sort((a, b) => b.yyyymmdd.localeCompare(a.yyyymmdd));

    if (!csvFiles.length) {
        throw new Error("CSV 파일을 찾지 못했습니다.");
    }

    csvFileIndex = csvFiles.slice().sort((a, b) => a.yyyymmdd.localeCompare(b.yyyymmdd));
    const latest = csvFiles[0];

    console.log("최신 CSV 발견:", latest.yyyymmdd);

    return {
        url: PAGES_BASE + latest.name + `?t=${Date.now()}`,
        yyyymmdd: latest.yyyymmdd
    };
}

            function fmtDateShort(yyyymmdd) {
                if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd || "";
                return yyyymmdd.slice(2,4) + "." + yyyymmdd.slice(4,6) + "." + yyyymmdd.slice(6,8);
            }

            function statCard(label, value) {
                return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
            }

            async function loadCsvRows(file) {
                if (historyCache.has(file.name)) return historyCache.get(file.name);
                const text = await fetchTextWithKorean(PAGES_BASE + file.name + `?t=${Date.now()}`);
                const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
                const data = parsed.data || [];
                historyCache.set(file.name, data);
                return data;
            }

            async function openTrend(region, area) {
                const $drawer = $("#trendDrawer");
                $drawer.addClass("open").attr("aria-hidden", "false");
                $("#trendTitle").text(region + " " + area + " 투자금 추이");
                $("#trendSub").text("과거 CSV 데이터를 불러오는 중…");
                $("#trendStats").empty();

                try {
                    if (!csvFileIndex.length) await resolveLatestCsv();

                    const points = [];
                    for (const file of csvFileIndex) {
                        try {
                            const data = await loadCsvRows(file);
                            const row = data.find(x => getRegion(x) === region && getArea(x) === area);
                            if (!row) continue;
                            const c = compute(row);
                            points.push({ date:file.yyyymmdd, inv59:c.inv59, inv84:c.inv84 });
                        } catch (e) {
                            console.warn("이력 CSV 로딩 실패:", file.name, e);
                        }
                    }

                    if (!points.length) {
                        $("#trendSub").text("이 지역의 과거 데이터를 찾지 못했습니다.");
                        if (trendChart) { trendChart.destroy(); trendChart = null; }
                        return;
                    }

                    const v59 = points.map(x => x.inv59).filter(Number.isFinite);
                    const v84 = points.map(x => x.inv84).filter(Number.isFinite);
                    const latest = points[points.length - 1];
                    $("#trendSub").text(points.length + "개 시점 · " + fmtDateShort(points[0].date) + " ~ " + fmtDateShort(latest.date));
                    $("#trendStats").html(
                        statCard("59 현재", fmt(latest.inv59)) +
                        statCard("59 최저 / 최고", fmt(Math.min(...v59)) + " / " + fmt(Math.max(...v59))) +
                        statCard("84 현재", fmt(latest.inv84)) +
                        statCard("84 최저 / 최고", fmt(Math.min(...v84)) + " / " + fmt(Math.max(...v84)))
                    );

                    const ctx = document.getElementById("trendChart");
                    if (trendChart) trendChart.destroy();
                    trendChart = new Chart(ctx, {
                        type: "line",
                        data: {
                            labels: points.map(x => fmtDateShort(x.date)),
                            datasets: [
                                { label:"59 투자금", data:points.map(x => Math.round(x.inv59)), borderWidth:2, tension:.25, pointRadius:3 },
                                { label:"84 투자금", data:points.map(x => Math.round(x.inv84)), borderWidth:2, tension:.25, pointRadius:3 }
                            ]
                        },
                        options: {
                            responsive:true, maintainAspectRatio:false, interaction:{ mode:"index", intersect:false },
                            plugins:{ legend:{ position:"top" }, tooltip:{ callbacks:{ label:(ctx) => ctx.dataset.label + ": " + Number(ctx.raw).toLocaleString("en-US") } } },
                            scales:{ y:{ ticks:{ callback:(v) => Number(v).toLocaleString("en-US") } } }
                        }
                    });
                } catch (err) {
                    console.error(err);
                    $("#trendSub").text("과거 추이 로딩에 실패했습니다. GitHub CSV 파일을 확인해 주세요.");
                }
            }

            $("#trendClose").on("click", function() {
                $("#trendDrawer").removeClass("open").attr("aria-hidden", "true");
                $("#tbl tbody tr").removeClass("selected-row");
            });

            async function fetchTextWithKorean(url) {
                const buf = await fetch(url, {
                    cache: "no-store"
                }).then(r => {
                    if (!r.ok) throw new Error("CSV fetch 실패");
                    return r.arrayBuffer();
                });

                function tryDecode(enc) {
                    return new TextDecoder(enc).decode(buf);
                }

                let text = tryDecode("utf-8");

                function looksOk(t) {
                    return (t.indexOf("region") >= 0 || t.indexOf("지역") >= 0 || t.indexOf("area") >= 0) && t.indexOf("\uFFFD") < 0;
                }

                if (!looksOk(text)) {
                    try {
                        const t2 = tryDecode("euc-kr");
                        if (looksOk(t2)) text = t2;
                    } catch (_) {}
                    try {
                        const t3 = tryDecode("windows-949");
                        if (looksOk(t3)) text = t3;
                    } catch (_) {}
                }
                return text;
            }

            async function loadLatestCSV() {
                $("#status").text("CSV 로딩 중… (최신 파일 탐색)");
                const latest = await resolveLatestCsv();

                const dot = yyyymmddToDot(latest.yyyymmdd);
                if (dot) {
                    $("#updateDate").text(dot);
                    document.title = "지역별 59/84 투자금 테이블 (" + dot + ")";
                }

                try {
                    const csvText = await fetchTextWithKorean(latest.url);
                    const parsed = Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true
                    });
                    rows = parsed.data || [];

                    if (!rows.length) {
                        $("#status").text("CSV를 읽었지만 데이터가 비어있어요. 파일 내용/구분자/인코딩을 확인해 주세요.");
                        return;
                    }

                    // 디버그(필요하면 콘솔에서 헤더 확인)
                    // console.log(Object.keys(rows[0] || {}));

                    $("#status").text("CSV 로딩 완료: " + rows.length.toLocaleString("en-US") + "행 (최신: " + (dot || latest.yyyymmdd) + ")");
                    initUI();
                } catch (err) {
                    console.error(err);
                    $("#status").text("CSV 로딩 실패. 최신 파일 URL/권한/인코딩을 확인해 주세요.");
                }
            }

            $(loadLatestCSV);
        })();
    </script>
