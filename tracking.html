<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>네이버 시세트레킹</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            color-scheme: light;
            --canvas: #eef3f8;
            --surface: #fff;
            --ink: #172b40;
            --muted: #52677b;
            --line: #d7e2eb;
            --accent: #15554b;
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            flex-direction: column;
            gap: 7px;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 8px;
            background: var(--canvas);
            color: var(--ink);
            font: 13px/1.4 system-ui, sans-serif;
        }

        .masthead, .excel-container, .btn-row, .left-span, .right-btns, .table-badges {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px 8px;
        }

        .masthead { min-height: 28px; padding: 0 4px; gap: 4px 10px; }
        .masthead h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -.045em; }
        .masthead span { color: var(--muted); font-size: 12px; }

        #loadingBar { position: fixed; inset: 0 0 auto; height: 4px; z-index: 10; }
        #loadingProgress { width: 0; height: 100%; background: #24a28b; transition: width .4s ease; }

        #btn-wrapper, .excel-container, .table-wrap {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 9px;
        }

        #btn-wrapper { padding: 3px 8px; }
        .btn-row { padding: 4px 0; gap: 4px; }
        .btn-row + .btn-row { border-top: 1px solid #edf2f6; }
        .btn-row > b:first-child { min-width: 76px; color: var(--ink); font-size: 12px; }
        #div_metro > b:not(:first-child) { margin-left: 4px; color: var(--muted); font-size: 11px; }
        .btn-row label, .filter-row label { display: inline-flex; align-items: center; gap: 4px; }

        button, input { font: inherit; }
        button, .btn-row label {
            padding: 4px 8px;
            border: 1px solid var(--chip-line, var(--line));
            border-radius: 6px;
            background: var(--chip-bg, #f8fafc);
            color: var(--chip-ink, var(--ink));
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { border-color: currentColor; }
        button:active { transform: translateY(1px); }
        :is(button, input, a):focus-visible { outline: 2px solid #187b6d; outline-offset: 2px; }
        input[type=radio], input[type=checkbox] { accent-color: var(--accent); margin: 0; }
        .btn-row label:has(:checked) { background: #e8f4ef; border-color: #9ac9bb; color: #124d43; }
        .red_btn { --chip-bg: #fceced; --chip-ink: #8f3542; }
        .orange_btn { --chip-bg: #fff0e1; --chip-ink: #864c23; }
        .yellow_btn { --chip-bg: #fff6d7; --chip-ink: #6c5313; }
        .green_btn, .olivedrab_btn { --chip-bg: #e9f4e9; --chip-ink: #2c6142; }
        .skyblue_btn { --chip-bg: #e9f3fc; --chip-ink: #285b82; }
        .lightSalmon_btn, .ligthseagreen_btn { --chip-bg: #e8f4f1; --chip-ink: #18594d; }
        .purple_btn { --chip-bg: #f0ebfa; --chip-ink: #594181; }
        .darkslategrey_btn { --chip-bg: #edf2fa; --chip-ink: #345380; }
        .darkgoldenrod_btn { --chip-bg: #faf0dd; --chip-ink: #735118; }

        .excel-container { padding: 5px 8px; }
        .right-btns { margin-left: auto; }
        #excelDownload { --chip-bg: #15554b; --chip-line: #15554b; --chip-ink: white; font-weight: 650; }
        .table-badges { gap: 4px; color: var(--muted); font-size: 12px; }
        #aptCntBadge, #update { border-radius: 5px; padding: 3px 7px; background: #eff4f8; }
        #aptCntBadge { color: #15554b; background: #e8f4ef; font-weight: 700; }
        .table-badges :empty { display: none; }

        .table-wrap { flex: 1; min-height: 140px; width: 100%; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; }
        thead { position: sticky; top: 0; z-index: 2; background: #e5eef6; }
        th, td { padding: 4px 7px; border-bottom: 1px solid #e6edf3; text-align: left; }
        th { font-size: 12px; }
        td { background: #fff; }
        tbody tr:nth-child(even) td { background: #f7fafd; }
        tbody tr:hover td { background: #edf6f5; }
        tbody td:nth-child(n+5):nth-child(-n+15), tbody td:nth-child(n+19) {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        thead tr:not(.filter-row) th:nth-child(n+10):nth-child(-n+12) { background: #d7e9e8; }
        tbody td:nth-child(10), tbody td:nth-child(11), tbody td:nth-child(12) {
            color: #154f46;
            font-weight: 700;
        }
        tbody td:nth-child(12) { border-left: 2px solid #d9eae7; }
        tbody td:nth-child(4), tbody td:nth-child(18) {
            min-width: 125px;
            max-width: 270px;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        tbody a { color: #1c6559; text-underline-offset: 2px; }
        tbody td:first-child a { color: var(--muted); }
        tbody td:nth-child(4) a { font-weight: 650; }
        .filter-row { background: #f1f6fa; }
        thead input:not([type=checkbox]) {
            width: 100%;
            min-width: 44px;
            padding: 3px 4px;
            border: 1px solid #aebfce;
            border-radius: 5px;
            color: var(--ink);
            background: #fff;
        }
        .empty-results { display: none; padding: 30px 10px; color: var(--muted); text-align: center; }
        .table-wrap:has(tbody:empty) .empty-results { display: block; }

        @media (max-width: 768px) {
            body { gap: 5px; padding: 5px; }
            .masthead h1 { font-size: 18px; }
            .btn-row > b:first-child { min-width: 62px; }
            th, td { padding: 4px 5px; }
            #tbl_aptInfo :is(th, td):is(:nth-child(1), :nth-child(2), :nth-child(8), :nth-child(17), :nth-child(18)) {
                display: none;
            }
        }
    </style>
</head>

    <script>
        function getLatestFile(baseName) {
            const listUrl = "https://roy-fild.github.io/tracking/result/fileList.json";
            const baseUrl = "https://roy-fild.github.io/tracking/result/";

            return $.getJSON(listUrl)
                .then(function(files) {
                    // baseName 으로 시작하고 .xlsx 로 끝나는 파일만 필터
                    let matchedFiles = files.filter(f => f.startsWith(baseName) && f.endsWith(".xlsx"));

                    if (matchedFiles.length === 0) {
                        alert(baseName + " 관련 파일이 없습니다.");
                        return null;
                    }

                    // 최신 날짜 기준 정렬 (yyyymmdd 비교)
                    matchedFiles.sort(function(a, b) {
                        let dateA = (a.match(/_(\d{8})\.xlsx$/) || [, ''])[1];
                        let dateB = (b.match(/_(\d{8})\.xlsx$/) || [, ''])[1];
                        return dateB.localeCompare(dateA); // 내림차순
                    });

                    // 최신 파일
                    let latestFile = matchedFiles[0];
                    // console.log(latestFile);
                    return baseUrl + latestFile;
                })
                .catch(function() {
                    alert("파일 목록을 불러올 수 없습니다.");
                    return null;
                });
        }

        $(document).ready(function() {

            // 버튼 토글 (접기/펼치기)
            $('#btn_toggle').on('click', function() {
                $('#btn-wrapper').toggle();
                if ($('#btn-wrapper').is(':visible')) {
                    $(this).text('▲ 접기');
                } else {
                    $(this).text('▼ 펼치기');
                }
            });
            // 버튼 개수 세기
            var btnSeoulCnt = $("#div_seoul button").length;
            var btnSuedoCnt = $("#div_suedo button").length;
            var btnMetroCnt = $("#div_metro button").length;
            var btnJibangCnt = $("#div_jibang button").length;

            // <b> 태그 내용 업데이트
            $("#div_seoul > b").text("서울시(" + btnSeoulCnt + ")"); // 서울시
            $("#div_suedo > b").text("수도권(" + btnSuedoCnt + ")"); // 수도권
            $("#div_metro > b").eq(0).text("광역시(" + btnMetroCnt + ")"); // 광역시
            $("#div_jibang > b").text("지방(" + btnJibangCnt + ")"); // 지방

            // 새창 띄우기
            $('#btn_new_window').on('click', function(e) {
                e.preventDefault();
                var currentUrl = window.location.href;
                window.open(currentUrl, '_blank');
            });


            // 정찰기(수도권)
            $('#btn_observer-sudo').on('click', function() {
                $('#hdn_sel-gu').val('정찰기-수도권');
                let gu = "tracking-list";
                $('#chk').prop('checked', false);
                beforeSearch(gu);
            });

            // 정찰기(지방)
            $('#btn_observer-jibang').on('click', function() {
                $('#hdn_sel-gu').val('정찰기-지방');
                let gu = "tracking-jibang";
                $('#chk').prop('checked', false);
                beforeSearch(gu);
            });

            /************************************
             * 지역구 버튼 공통 이벤트
             * - 아래 4개 영역 안의 버튼만 대상
             * - 다른 버튼 영향 없음
             * - 버튼 추가 시 click 이벤트 추가 불필요
             ************************************/
            $('#div_seoul, #div_suedo, #div_metro, #div_jibang').on('click', 'button[id^="btn_"]', function() {
            
                const gu = this.id.replace(/^btn_/, '');
                const label = $(this).data('label') || $(this).text().trim();
           
                $('#hdn_sel-gu').val(label);
                beforeSearch(gu);
            });


            // Table 내용 엑셀 다운로드
            $('#excelDownload').on('click', function() {

                let table = document.getElementById('tbl_aptInfo');

                // 테이블에 데이터가 있는지 확인
                let tbody = table.querySelector('tbody');
                if (!tbody || tbody.rows.length === 0) {
                    alert("테이블에 데이터가 없습니다.");
                    return;
                }

                let wb = XLSX.utils.book_new();
                let ws = XLSX.utils.table_to_sheet(table, {
                    sheetStubs: true
                }); // table을 시트로 변환하면서 stub을 추가

                // 열 너비 자동 조정
                let colWidths = [];
                let range = XLSX.utils.decode_range(ws['!ref']);

                for (let C = range.s.c; C <= range.e.c; ++C) {
                    let maxWidth = 10;
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        let cell_address = XLSX.utils.encode_cell({
                            r: R,
                            c: C
                        });
                        let cell = ws[cell_address];

                        if (cell && cell.v) {
                            let cellValue = String(cell.v);
                            maxWidth = Math.max(maxWidth, cellValue.length + 2);
                        }
                    }
                    colWidths.push({
                        wch: maxWidth
                    });
                }
                ws['!cols'] = colWidths;

                // 스타일 적용 (기본 적용 확인)
                Object.keys(ws).forEach(cell => {
                    if (ws[cell] && ws[cell].t) {
                        ws[cell].s = {
                            font: {
                                name: "Arial",
                                sz: 10
                            } // Arial 폰트 + 크기 10
                        };
                    }
                });
                XLSX.utils.book_append_sheet(wb, ws, "아파트 정보"); // 시트 추가

                // #update에서 숫자만 추출
                let updateText = $('#update').text();
                let dateStr = updateText.replace(/\D/g, ''); // 숫자만 추출

                var fileNm = $('#hdn_sel-gu').val() + '_시세_트래킹_' + dateStr + '.xlsx'

            // 정렬 토글 상태: desc(내림차순) 시작
            $('#btn_sort').data('order', 'desc');

            function parsePrice(text) {
                const n = parseFloat(String(text).replace(/,/g, ''));
                return isNaN(n) ? -Infinity : n; // 숫자 아님은 제일 뒤로
            }

            $('#btn_sort').on('click', function() {
                const $btn = $(this);
                const current = $btn.data('order') || 'desc';
                const next = current === 'desc' ? 'asc' : 'desc';
                $btn.data('order', next);
                $btn.text(next === 'desc' ? '정렬 ▼' : '정렬 ▲');

                const $tbody = $('#tbl_aptInfo tbody');
                const rows = $tbody.find('tr').get();

                rows.sort(function(a, b) {
                    const aPrice = parsePrice($(a).find('td').eq(9).text());
                    const bPrice = parsePrice($(b).find('td').eq(9).text());
                    return next === 'desc' ? (bPrice - aPrice) : (aPrice - bPrice);
                });

                // 현재 화면에 나온(필터로 숨겨진 것도 포함) 행들을 정렬 순서대로 재배치

            $(document).ajaxStop(function() {

            function toNum(v) {
                if (v === null || v === undefined) return NaN;
                const s = String(v).replace(/[^\d.\-]/g, '').trim();
                const n = parseFloat(s);
                return isNaN(n) ? NaN : n;
            }

            // 숫자 매칭: '3.' => 정수부 프리픽스(3.*), '3.2' => 소수부 자리수만큼 정확히, '3' => 정수부 프리픽스
            function numMatch(valueNum, rawInput) {
                if (rawInput == null) return true;
                const s = String(rawInput).trim();
                if (s === '') return true;
                if (isNaN(valueNum)) return false;

                const cleaned = s.replace(/,/g, ''); // 소수점은 유지
                if (cleaned.endsWith('.')) {
                    // "3." => 정수부가 3인 모든 값(3, 3.0, 3.1, 3.2...)
                    const intPart = parseInt(cleaned.slice(0, -1), 10);
                    if (isNaN(intPart)) return true;
                    return Math.floor(valueNum) === intPart;
                }
                if (cleaned.includes('.')) {
                    // "3.2" => 소수점 자리수 맞춰 비교(반올림해 자리수만큼 동일하면 매칭)
                    const parts = cleaned.split('.');
                    const decLen = (parts[1] || '').length;
                    const target = parseFloat(cleaned);
                    if (isNaN(target)) return true;
                    const factor = Math.pow(10, decLen);
                    return Math.round(valueNum * factor) === Math.round(target * factor);
                }
                // "3" => 정수부가 3인 모든 값
                const intPart = parseInt(cleaned, 10);
                if (isNaN(intPart)) return true;
                return Math.floor(valueNum) === intPart;
            }

            // Table 필터

                    const price = toNum($(this).find('td').eq(9).text()); // 매매
                    const gap = toNum($(this).find('td').eq(11).text()); // 차액 ★            
                    const size = $(this).find('td').eq(6).text().trim();
                    const aptNm = $(this).find('td').eq(3).text().trim();
                    const dong = $(this).find('td').eq(2).text().trim();
                    const year = $(this).find('td').eq(4).text().trim();

                    let showRow = true;

                    if (filter300Checked && units < 300) showRow = false;

                    if (showRow && priceRaw) {
                        if (!numMatch(price, priceRaw)) showRow = false;
                    }
                    if (showRow && gapRaw) {
                        if (!numMatch(gap, gapRaw)) showRow = false;
                    }

                    if (showRow && filterSizeInput && !size.includes(filterSizeInput)) showRow = false;
                    if (showRow && filterAptNmInput && !aptNm.includes(filterAptNmInput)) showRow = false;
                    if (showRow && filterDongInput && !dong.includes(filterDongInput)) showRow = false;

        /**
         * 트래킹 내용 검색
         */
        function getTrackingResult(gu, append = false) {
            getLatestFile(gu).then(function(fileUrl) {
                var formattedDate = extractFormattedDate(fileUrl);
                // append=false 일 때만 초기화/타이틀/업데이트 표시

                    $('#tbl_aptInfo tbody').empty();
                }
                $.ajax({
                    url: fileUrl,
                    method: "GET",
                    xhrFields: {
                        responseType: "blob" // 바이너리 데이터로 가져오기
                    },
                    success: function(data) {
                        let reader = new FileReader();
                        reader.onload = function(e) {
                            let arrayBuffer = e.target.result;
                            let workBook = XLSX.read(arrayBuffer, {
                                type: "array"
                            });

                            workBook.SheetNames.forEach(function(sheetName) {
                                // console.log('SheetName: ' + sheetName);
                                let rows = XLSX.utils.sheet_to_json(workBook.Sheets[sheetName]);
                                var keys = Object.keys(rows);


                                for (var i = 0; i < keys.length; i++) {
                                    var key = keys[i];
                                    var subKeys = Object.keys(rows[key]);

                                    var id = rows[key][subKeys[0]]; // ID
                                    var gu = rows[key][subKeys[1]]; // 구
                                    var dong = rows[key][subKeys[2]]; // 동
                                    var nm = rows[key][subKeys[3]]; // 아파트명
                                    var yr = rows[key][subKeys[4]]; // 연식
                                    var sd = rows[key][subKeys[5]]; // 세대
                                    var tp = rows[key][subKeys[6]]; // 타입
                                    var tp2 = rows[key][subKeys[7]]; // 유형
                                    var bang = rows[key][subKeys[8]]; // 방개수
                                    var me = rows[key][subKeys[9]]; // 매매가
                                    var ju = rows[key][subKeys[10]]; // 전세가
                                    var mj = rows[key][subKeys[11]]; // 차액

                                    var mCnt = rows[key][subKeys[12]]; // 매매개수
                                    var jCnt = rows[key][subKeys[13]]; // 전세개수
                                    var mFr = rows[key][subKeys[14]]; // 매/층
                                    var jFr = rows[key][subKeys[15]]; // 전/층
                                    var desc = rows[key][subKeys[16]]; // 설명
                                    var szKey = rows[key][subKeys[17]]; // key
                                    var prev = rows[key][subKeys[18]]; // 전고점
                                    var chg = rows[key][subKeys[19]]; // 변화율
                                    var rat = rows[key][subKeys[20]]; // 수익율
                                    var amt = rows[key][subKeys[21]]; // 수익금


                                    var rate = "0.0%"; // 전세가율

                                    // console.log(me, ju);

                                    if (me !== '' && ju !== '') {

                                        var m = parseFloat(me);
                                        var j = parseFloat(ju);


                                        rate = (j / m) * 100;
                                        rate = (Math.round(rate * 10) / 10) + '%'; // 소수점 1자리 반올림
                                    }

                                    createTableList(id, gu, dong, nm, yr, sd, tp, tp2, bang, me, ju, mj, rate, mCnt, jCnt, mFr, jFr, desc, szKey, prev, chg, rat, amt);
                                }
                            })

                            aptRowCnt();

                        };

                        reader.readAsArrayBuffer(data);
                    },
                    error: function() {
                        alert("엑셀 파일을 다운로드하는 중 오류가 발생했습니다.");
                    }
                });
            });
        }


        /** 
         *  비교용 내역을 Excel 에서 가져옴
         */
        function getCompareList(gu, append = false) {
            var compareList = [];
            var cmpfileUrl = "https://roy-fild.github.io/tracking/compare/" + gu + ".xlsx";

            // 요청 토큰(뒤에서 결과 렌더 시 최신 요청만 통과)
            window.__REQ_TOKEN__ = (window.__REQ_TOKEN__ || 0) + 1;
            const myToken = window.__REQ_TOKEN__;

            $.ajax({
                url: cmpfileUrl,
                method: "GET",
                xhrFields: {
                    responseType: "blob"
                },
                success: function(data) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        let arrayBuffer = e.target.result;
                        let wb = XLSX.read(arrayBuffer, {
                            type: "array"
                        });

                        // 시트를 "배열"로 읽어 순서 100% 보장
                        wb.SheetNames.forEach(function(sheetName) {
                            const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
                                header: 1, // 배열로
                                defval: "" // 빈칸도 빈 문자열
                            });
                            // 1행이 헤더라면 1행부터 데이터 시작(필요 시 0으로)
                            for (let r = 1; r < aoa.length; r++) {
                                const row = aoa[r];
                                // [0]=ID, [1]=아파트명, [2]=타입  ← compare 엑셀 컬럼 순서에 맞춰 인덱스 지정
                                const id = row[0];
                                const nm = row[1];
                                const tp = row[2];
                                if (!id) continue; // 빈줄 스킵
                                compareList.push({
                                    id,
                                    nm,
                                    tp
                                });
                            }
                        });

                        // 최신 요청만 허용
                        if (myToken === window.__REQ_TOKEN__) {
                            getCompareResult(gu, compareList, myToken, append);
                        }
                    };
                    reader.readAsArrayBuffer(data);
                },
                error: function() {
                    alert("엑셀 파일을 다운로드하는 중 오류가 발생했습니다.");
                }
            });
        }


        /**
         * Excel 파일에서 내용 가져오기
         */
        function getCompareResult(gu, compareList, reqToken, append = false) {
            getLatestFile(gu).then(function(fileUrl) {
                if (reqToken && reqToken !== window.__REQ_TOKEN__) return; // 이전 요청 무시

                var formattedDate = extractFormattedDate(fileUrl);
                if (!append) {
                    $('#update').text(`최종업데이트: ${formattedDate}`);
                    document.title = `(${$('#hdn_sel-gu').val()})네이버 시세 트래킹`;
                    $('#tbl_aptInfo tbody').empty();
                }


                var resultList = [];

                $.ajax({
                    url: fileUrl,
                    method: "GET",
                    xhrFields: {
                        responseType: "blob"
                    },
                    success: function(data) {
                        let reader = new FileReader();
                        reader.onload = function(e) {
                            let arrayBuffer = e.target.result;
                            let wb = XLSX.read(arrayBuffer, {
                                type: "array"
                            });

                            wb.SheetNames.forEach(function(sheetName) {
                                const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
                                    header: 1,
                                    defval: ""
                                });
                                // ✅ AOA 인덱싱: 아래 인덱스는 "트래킹 결과" 엑셀의 실제 순서를 맞춰줘야 함
                                // 0:ID, 1:구, 2:동, 3:단지명, 4:연식, 5:세대, 6:타입, 7:유형, 8:방,
                                // 9:매매, 10:전세, 11:차액, 12:매매개수, 13:전세개수, 14:매/층, 15:전/층, 16:설명, 17:key, 18:전고점, 19:변화율, 20:수익률, 21:수익금
                                for (let r = 1; r < aoa.length; r++) {
                                    const row = aoa[r];
                                    if (!row[0]) continue; // ID 없으면 스킵
                                    resultList.push({
                                        id: row[0],
                                        gu: row[1],
                                        dong: row[2],
                                        nm: row[3],
                                        yr: row[4],
                                        sd: row[5],
                                        tp: row[6],
                                        tp2: row[7],
                                        bang: row[8],
                                        me: row[9],
                                        ju: row[10],
                                        rate: '',
                                        mj: '',
                                        mCnt: row[13],
                                        jCnt: row[14],
                                        mFr: row[15],
                                        jFr: row[16],
                                        desc: row[17],
                                        szKey: row[18],
                                        prev: row[19],
                                        chg: row[20],
                                        rat: row[21],
                                        amt: row[22]
                                    });
                                }
                            });

                            if (!reqToken || reqToken === window.__REQ_TOKEN__) {
                                comparing(compareList, resultList);
                            }
                        };
                        reader.readAsArrayBuffer(data);
                    },
                    error: function() {
                        alert("엑셀 파일을 다운로드하는 중 오류가 발생했습니다.");
                    }
                });
            });
        }

        // 비교 출력 (매매/전세 각각 최저가, 매매 우선 병합 출력)
        function comparing(compareList, resultList) {
            console.log(compareList);
            console.log(resultList);

            $('#tbl_aptInfo tbody').empty();

            const toNum = (v) => {
                if (v === null || v === undefined) return NaN;
                const s = String(v).replace(/,/g, '').trim();
                const n = parseFloat(s);
                return isNaN(n) ? NaN : n;
            };

            const tpMatches = (rowTp, cmpTp) => {
                if (!cmpTp) return true;
                if (!rowTp) return false;
                return String(rowTp).includes(String(cmpTp)); // 필요시 완전일치(===)로
            };

            const idMatches = (rowId, cmpId) =>
                String(rowId).trim() === String(cmpId).trim();

            for (let i = 0; i < compareList.length; i++) {
                const {
                    id: cmpId,
                    tp: cmpTp,
                    nm: cmpNm
                } = compareList[i];

                // 후보군
                const saleCandidates = resultList.filter(row =>
                    idMatches(row.id, cmpId) && tpMatches(row.tp, cmpTp) && !isNaN(toNum(row.me))
                );
                const rentCandidates = resultList.filter(row =>
                    idMatches(row.id, cmpId) && tpMatches(row.tp, cmpTp) && !isNaN(toNum(row.ju))
                );

                // 최저 매매, 최저 전세 각각 찾기
                let bestSale = null,
                    bestSalePrice = Infinity;
                for (const r of saleCandidates) {
                    const p = toNum(r.me);
                    if (!isNaN(p) && p < bestSalePrice) {
                        bestSale = r;
                        bestSalePrice = p;
                    }
                }

                let bestRent = null,
                    bestRentPrice = Infinity;
                for (const r of rentCandidates) {
                    const p = toNum(r.ju);
                    if (!isNaN(p) && p < bestRentPrice) {
                        bestRent = r;
                        bestRentPrice = p;
                    }
                }

                // 메타데이터 보강용(구/동/연식/세대/단지명 등) - 매매 우선, 없으면 같은 ID의 아무 행
                const anyRowSameId = resultList.find(row => idMatches(row.id, cmpId));
                const base = bestSale || anyRowSameId || bestRent; // 우선순위: 매매 > 같은ID > 전세

                // 출력 값 조립
                const id = cmpId;
                const gu = base ? base.gu : "";
                const dong = base ? base.dong : "";
                const nm = base ? base.nm : (cmpNm || "(비교대상 없음)");
                const yr = base ? base.yr : "";
                const sd = base ? base.sd : "";

                const tp = cmpTp || (base ? base.tp : ""); // 요청 타입 우선 노출
                const tp2 = bestSale ? bestSale.tp2 : (bestRent ? bestRent.tp2 : "");
                const bang = base ? base.bang : "";

                const me = bestSale ? bestSale.me : ""; // 매매 최저가(없으면 공백)
                const ju = bestRent ? bestRent.ju : ""; // 전세 최저가(없으면 공백)

                // 차액/전세가율 계산(둘 다 숫자일 때만)
                const mNum = toNum(me);
                const jNum = toNum(ju);
                const mj = (!isNaN(mNum) && !isNaN(jNum)) ? (Math.round((mNum - jNum) * 10) / 10) : "";
                const rate = (!isNaN(mNum) && mNum > 0 && !isNaN(jNum)) ?
                    (Math.round((jNum / mNum) * 1000) / 10) + '%' :
                    "";

                const desc = (bestSale && bestSale.desc) ? bestSale.desc : (base ? base.desc : "");
                const szKey = base ? base.szKey : "";
                const prev = base ? base.prev : "";
                const chg = base ? base.chg : "";
                const rat = base ? base.rat : "";
                const amt = base ? base.amt : "";

                    tp, tp2, bang, me, ju, mj,
                    rate, mCnt, jCnt, mFr, jFr, desc, szKey, prev, chg, rat, amt
                );
            }

            aptRowCnt();
        }

        // url 에서 날짜를 추출해서 yyyy.mm.dd 형식으로 반환
        function extractFormattedDate(fileUrl) {
            // 정규식으로 _yyyymmdd.xlsx 패턴 추출
            var match = fileUrl.match(/_(\d{8})\.xlsx$/);
            if (!match) return null; // 날짜 패턴 없으면 null 반환

            var yyyymmdd = match[1];
            var year = yyyymmdd.substring(0, 4);
            var month = yyyymmdd.substring(4, 6);
            var day = yyyymmdd.substring(6, 8);

            return year + "." + month + "." + day;
        }


        function aptRowCnt() {
            const names = new Set();

            $('#tbl_aptInfo tbody tr').each(function() {
                const name = $(this).find('td:first').text().trim();
                names.add(name);
            });

            // $('#aptCnt').text(`TOTAL: ${names.size}`);
            $('#aptCntBadge').text(`TOTAL: ${names.size}`)
