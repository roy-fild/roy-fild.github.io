name: Weekly tracking collection

on:
  schedule:
    # Sunday 07:15 in Korea = Saturday 22:15 UTC.
    - cron: '15 22 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracking-weekly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run Spring Batch
        working-directory: batch/tracking
        env:
          TRACKING_OUTPUT_DIR: ${{ github.workspace }}/file
        run: gradle --no-daemon run
      - name: Commit dated spreadsheets
        shell: bash
        run: |
          git add -- ':(glob)file/*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].xlsx'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update weekly apartment tracking spreadsheets'
          git pull --rebase origin main
          git push origin HEAD:main
