:root{color-scheme:light;--ink:#172839;--muted:#506174;--line:#dce4ec;--card:#fff;--blue:#ecf4fb}

.toolbar{display:flex;gap:6px;align-items:center;position:relative;margin:8px 0 5px;font-size:13px;white-space:nowrap}
.toolbar>label{display:inline-flex;align-items:center;gap:3px}
.toolbar input{margin:0}

.filters summary{cursor:pointer;font-weight:600}
.checks{position:absolute;top:calc(100% + 5px);left:0;z-index:5;display:flex;flex-wrap:wrap;gap:7px 14px;width:min(100%,760px);max-height:210px;overflow:auto;padding:10px 12px;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px #17283920}
.filters:not([open]) .checks{display:none}
.compact-label{display:none}
@media(max-width:520px){
  .toolbar{gap:4px;font-size:12px}
  button,.filters summary{padding:4px}
  .full-label{display:none}.compact-label{display:inline}
}
.price-form{align-items:center}
.price-form input{width:72px;font:inherit;padding:4px;border:1px solid #becbd7;border-radius:5px}
@media(max-width:370px){.toolbar{gap:3px}.toolbar summary span{display:none}}
.checks label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
#status,.legend,#notes{font-size:12px}#notes:empty{display:none}
.frame{max-height:71vh;overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}
table{border-spacing:0;min-width:100%;width:max-content;font-size:13px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
thead th{position:sticky;background:var(--blue);z-index:2;height:38px}
thead tr:first-child th{top:0}thead tr:nth-child(2) th{top:38px}thead th small{font-weight:normal;color:var(--muted);margin-left:6px}
tbody th,.corner{position:sticky;left:0;background:#f0f5f9;z-index:1;text-align:right;font-variant-numeric:tabular-nums}.corner{z-index:3}
td{min-width:160px}td div+div{margin-top:4px}td a{color:inherit;text-decoration:none}td a:hover{text-decoration:underline}
.up{color:#a52c28}.down{color:#1f5597}.flat,.unknown,.missing{color:#536374}.mark{font-weight:700;margin-right:5px}
</style>

<script>
'use strict';
const SITE = 'https://roy-fild.github.io/';
const SOURCE = SITE + 'tracking/result/';
const OBSERVER = SITE + 'gain/observer/';
const REPO = 'roy-fild/roy-fild.github.io';
const API = 'https://api.github.com/repos/' + REPO;
const RAW = 'https://raw.githubusercontent.com/' + REPO + '/';
const LEVELS = {1:'1군',2:'2군',3:'3군',4:'4군',5:'5군',L:'수도권외곽',G:'광역시',S:'중소도시'};
const numberFormat = new Intl.NumberFormat('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:6});
const clean = value => String(value ?? '').trim();
const normalizedName = value => clean(value).normalize('NFKC').toLowerCase()
  .replace(/\([^)]*\)|\([^)]*$/g,'').replace(/[^가-힣a-z0-9]/g,'').replaceAll('이편한세상','e편한세상');
const complexId = value => /^\d+$/.test(clean(value)) ? clean(value) : '';
const is84 = value => /^84(?:\.\d+)?(?:\s*[A-Z][A-Z0-9-]*)?(?:\s*(?:㎡|m²|m2))?$/i.test(clean(value));
const dateLabel = value => value ? value.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3') : '자료 없음';

function parsePrice(value) {
  const raw = clean(value).replaceAll(',','').replace(/\s*억$/,'');
  if (!/^\+?(?:\d+(?:\.\d+)?|\.\d+)$/.test(raw) || !Number.isFinite(Number(raw)) || Number(raw) <= 0) return null;
  return Number(Number(raw).toFixed(6));
}
function trackingFiles(names) {
  if (!Array.isArray(names)) throw Error('tracking 파일 목록 형식 오류');
  return names.flatMap(name => {
    const match = /^([a-z0-9-]+)_(\d{8})\.xlsx$/i.exec(name);
    return match ? [{name,key:match[1],date:match[2]}] : [];
  }).sort((a,b) => b.date.localeCompare(a.date));
}
function previousMonth(date) {
  const d = new Date(Date.UTC(+date.slice(0,4), +date.slice(4,6)-1, 0));
  return d.toISOString().slice(0,7).replace('-','');
}
function parseCsv(text) {
  const workbook = XLSX.read(text.replace(/^\uFEFF/,''),{type:'string',FS:',',raw:true});
  const [header = [], ...rows] = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{header:1,raw:true,defval:''});
  if (header.slice(0,4).map(clean).join(',') !== 'name,file,lv,id') throw Error('observer_list.csv의 열 이름을 확인하세요.');
  const regions = rows.map(([name,key,level,...ids]) => ({
    name:clean(name),key:clean(key),level:clean(level),
    ids:[...new Set(ids.flatMap(value => clean(value).split(',')).map(complexId).filter(Boolean))]
  })).filter(region => region.name);
  if (!regions.length || regions.some(region => !/^[a-z0-9-]+$/.test(region.key))) throw Error('observer_list.csv의 지역 파일 이름을 확인하세요.');
  return regions;
}
function parseTracking(workbook) {
  const index = new Map();
  let usable = false;
  for (const sheet of Object.values(workbook.Sheets)) {
    const [header = [], ...rows] = XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
    const labels = header.map(value => clean(value).replace(/\s/g,'').toLowerCase());
    const col = (...names) => labels.findIndex(label => names.includes(label));
    const id = col('id'), name = col('단지','단지명','아파트명'), area = col('타입','전용면적'), sale = col('매매가','매매');
    if ([id,name,area,sale].includes(-1)) continue;
    usable = true;
    const year = col('연식','준공'), units = col('세대','세대수');
    for (const row of rows) {
      const key = complexId(row[id]), title = clean(row[name]);
      if (!key || !title || title.toLowerCase() === 'description') continue;
      const item = index.get(key) || {name:title,year:clean(row[year]),units:clean(row[units]),price:null};
      const price = is84(row[area]) ? parsePrice(row[sale]) : null;
      if (price !== null && (item.price === null || price < item.price)) item.price = price;
      index.set(key,item);
    }
  }
  if (!usable) throw Error('tracking 필수 열을 찾을 수 없습니다.');
  return index;
}
function parseReference(workbook) {
  const sheet = workbook.Sheets['정찰기'];
  if (!sheet) throw Error('정찰기 시트 없음');
  const grid = XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',blankrows:true});
  return new Map((grid[1] || []).map((value,i) => [clean(value),grid.slice(2).flatMap(row =>
    clean(row[i]).split(/\r?\n/).map(clean).filter(Boolean))]).filter(([name]) => name));
}
function nameFromEntry(entry) {
  return entry.replace(/\s*\/\s*\d.*$/,'');
}
function referenceInfo(id, live, old, entries, known) {
  const saved = known.find(([key]) => key === id)?.[1];
  for (const name of [live?.name,old?.name,saved && nameFromEntry(saved)].filter(Boolean)) {
    const matches = entries.filter(entry => normalizedName(nameFromEntry(entry)) === normalizedName(name));
    if (matches.length === 1) return matches[0];
  }
  const item = live || old;
  return item ? [item.name,item.year,item.units].filter(Boolean).join('/') : saved || '단지 ID ' + id;
}
function statusOf(price, previous) {
  if (price === null) return ['(X)','missing'];
  if (previous === null) return ['(비교없음)','unknown'];
  if (price > previous) return ['(▲)','up'];
  if (price < previous) return ['(▼)','down'];
  return ['(-)','flat'];
}

async function requestWorkbook(url) {
  const blob = await $.ajax({url,cache:false,timeout:18000,xhrFields:{responseType:'blob'}});
  return XLSX.read(await blob.arrayBuffer(),{type:'array'});
}
async function pool(keys, fn) {
  let pos = 0;
  await Promise.all(Array.from({length:Math.min(6,keys.length)},async () => {
    while (pos < keys.length) await fn(keys[pos++]);
  }));
}
async function latestReference() {
  const files = await $.ajax({url:API+'/contents/gain/observer?ref=main',dataType:'json',timeout:10000});
  const candidates = files.map(file => file.name).filter(name => /^list_\d{6}\.xlsx$/i.test(name)).sort().reverse();
  if (!candidates.length) throw Error('list_yymmdd.xlsx 없음');
  return {name:candidates[0],entries:parseReference(await requestWorkbook(OBSERVER+candidates[0]))};
}
async function archiveFor(month) {
  const year = +month.slice(0,4), index = +month.slice(4);
  const from = new Date(Date.UTC(year,index-1,1,0,0,0)-9*3600000).toISOString();
  const until = new Date(Date.UTC(year,index,1,0,0,0)-9*3600000-1000).toISOString();
  const commits = await $.ajax({url:API+'/commits',data:{
    path:'tracking/result/fileList.json',since:from,until,per_page:1
  },dataType:'json',timeout:12000});
  const sha = commits[0]?.sha;
  if (!sha) return null;
  const base = RAW+sha+'/tracking/result/';
  const names = await $.ajax({url:base+'fileList.json',dataType:'json',timeout:12000});
  return {base,files:trackingFiles(names)};
}

function matrixRows(regions, showMissing, {min = null, max = null} = {}) {
  const prices = new Set();
  const byPrice = regions.map(region => {
    const priced = new Map(), missing = [];
    for (const item of region.items) {
      if (item.price === null) { missing.push(item); continue; }
      if ((min !== null && item.price < min) || (max !== null && item.price > max)) continue;
      prices.add(item.price);
      if (!priced.has(item.price)) priced.set(item.price,[]);
      priced.get(item.price).push(item);
    }
    return {priced,missing};
  });
  const rows = [...prices].sort((a,b) => b-a).map(price => ({
    price,cells:byPrice.map(region => region.priced.get(price) || [])
  }));
  if (showMissing && byPrice.length) {
    const count = Math.max(...byPrice.map(region => region.missing.length));
    for (let i=0;i<count;i++) rows.push({price:null,cells:byPrice.map(region => region.missing.slice(i,i+1))});
  }
  return rows;
}

const complexUrl = id => 'https://new.land.naver.com/complexes/'+encodeURIComponent(id);

function exportWorkbook(regions, rows) {
  const values = [
    ['급지', ...regions.map(region => LEVELS[region.level] || region.level)],
    ['매매가 (억)', ...regions.map(region => region.name+' '+dateLabel(region.date))]
  ];
  const links = [];
  for (const {price,cells} of rows) {
    const lines = Math.max(1,...cells.map(items => items.length));
    for (let line=0;line<lines;line++) {
      const row = [price ?? '—'];
      for (const items of cells) {
        const item = items[line];
        if (item) links.push({r:values.length,c:row.length,id:item.id});
        row.push(item ? statusOf(item.price,item.previous)[0]+' '+item.info : null);
      }
      values.push(row);
    }
  }
  const workbook = XLSX.utils.book_new();
  const sheet = XLSX.utils.aoa_to_sheet(values);
  for (const {r,c,id} of links) sheet[XLSX.utils.encode_cell({r,c})].l = {Target:complexUrl(id)};
  sheet['!cols'] = [{wch:14}, ...regions.map(() => ({wch:42}))];
  XLSX.utils.book_append_sheet(workbook,sheet,'정찰기 84㎡');
  return workbook;
}

document.addEventListener('DOMContentLoaded',() => {
  if (!window.jQuery || !window.XLSX) {
    document.getElementById('status').textContent = 'jQuery 또는 SheetJS를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
    return;
  }
  const known = JSON.parse($('#reference-map').text());
  let model = [];
  const hiddenLevels = new Set(), hiddenRegions = new Set();
  let shown = {regions:[],rows:[]};
  let priceRange = {min:null,max:null};
  const eligibleRegions = () => model.filter(region => !hiddenLevels.has(region.level));
  const regionKey = region => JSON.stringify([region.name,region.key]);
  function makeChecks(id, options, excluded, onChange) {
    const group = $('#'+id).empty();
    const selectedCount = options.filter(({key}) => !excluded.has(key)).length;
    const allSelected = options.length > 0 && selectedCount === options.length;
    $('#'+id+'-count').text(allSelected ? '(전체)' : '('+selectedCount+'/'+options.length+')');
    function appendCheck(label, checked, change) {
      const input = $('<input type="checkbox">').prop('checked',checked).on('change',event => change(event.target.checked));
      $('<label>').append(input,document.createTextNode(' '+label)).appendTo(group);
      return input;
    }
    appendCheck('전체',allSelected,checked => {
      for (const {key} of options) checked ? excluded.delete(key) : excluded.add(key);
      onChange();
    }).prop({indeterminate:selectedCount > 0 && !allSelected,disabled:!options.length});
    for (const {key,label} of options) {
      appendCheck(label,!excluded.has(key),checked => {
        checked ? excluded.delete(key) : excluded.add(key);
        onChange(key);
      });
    }
  }
  function refreshFilters(focusId, focusKey) {
    const levels = [...new Set(model.map(region => region.level))];
    makeChecks('level',levels.map(key => ({key,label:LEVELS[key] || key})),hiddenLevels,key => refreshFilters('level',key));
    const regions = eligibleRegions();
    makeChecks('region',regions.map(region => ({key:regionKey(region),label:region.name})),hiddenRegions,key => refreshFilters('region',key));
    if (focusId) {
      const keys = focusId === 'level' ? levels : regions.map(regionKey);
      $('#'+focusId+' input').eq(focusKey === undefined ? 0 : keys.indexOf(focusKey)+1).trigger('focus');
    }
    render();
  }
  function render() {
    const regions = eligibleRegions().filter(region => !hiddenRegions.has(regionKey(region)));
    const matrix = matrixRows(regions,$('#show-missing').prop('checked'),priceRange);
    shown = {regions,rows:matrix};
    $('#download').prop('disabled',!regions.length);
    const head = $('thead').empty(), body = $('tbody').empty();
    if (!regions.length) {
      $('<tr>').append($('<td>').text('표시할 지역을 선택하세요.')).appendTo(body);
      return;
    }
    const top = $('<tr>').appendTo(head), bottom = $('<tr>').appendTo(head);
    $('<th class="corner">').text('급지').appendTo(top);
    $('<th class="corner">').text('매매가 (억)').appendTo(bottom);
    for (const region of regions) {
      $('<th>').text(LEVELS[region.level] || region.level).appendTo(top);
      $('<th scope="col">').text(region.name).append($('<small>').text(dateLabel(region.date))).appendTo(bottom);
    }
    function addRow(label, cells) {
      const tr = $('<tr>').appendTo(body);
      $('<th scope="row">').text(label).appendTo(tr);
      for (const items of cells) {
        const td = $('<td>').appendTo(tr);
        for (const item of items) {
          const [mark,css] = statusOf(item.price,item.previous);
          const line = $('<div>').appendTo(td);
          const url = complexUrl(item.id);
          const detail = item.previous === null ? '' : '전월 '+numberFormat.format(item.previous)+'억';
          const link = $('<a>',{href:url,target:'_blank',rel:'noopener',title:detail}).appendTo(line);
          $('<span class="mark">').addClass(css).text(mark).appendTo(link);
          link.append(document.createTextNode(' '+item.info));
        }
      }
    }
    for (const {price,cells} of matrix) addRow(price === null ? '—' : numberFormat.format(price),cells);
    if (!body.children().length) $('<tr>').append($('<td>').attr('colspan',regions.length+1).text('표시할 84㎡ 매매가가 없습니다.')).appendTo(body);
  }
  async function load() {
    $('#reload').prop('disabled',true);
    $('#status').text('최신 tracking 및 비교 자료를 불러오는 중…');
    $('#notes').empty();
    try {
      const notes = [];
      const [csv,manifest,ref] = await Promise.allSettled([
        $.ajax({url:OBSERVER+'observer_list.csv',dataType:'text',cache:false,timeout:15000}),
        $.ajax({url:SOURCE+'fileList.json',dataType:'json',cache:false,timeout:15000}),
        latestReference()
      ]);
      if (csv.status === 'rejected') throw Error('observer_list.csv를 불러오지 못했습니다.');
      const regions = parseCsv(csv.value);
      const files = manifest.status === 'fulfilled' ? trackingFiles(manifest.value) : [];
      if (manifest.status === 'rejected') notes.push('최신 tracking 목록 조회 실패');
      if (ref.status === 'rejected') notes.push('최신 참조 목록 조회 실패 · 내장 단지 정보 사용');
      const keys = [...new Set(regions.map(region => region.key))];
      const current = new Map(keys.map(key => [key,files.find(file => file.key === key)]));
      const months = [...new Set([...current.values()].filter(Boolean).map(file => previousMonth(file.date)))];
      const archives = new Map();
      await Promise.all(months.map(async month => {
        try { archives.set(month,await archiveFor(month)); }
        catch { notes.push(month.slice(0,4)+'-'+month.slice(4)+' 전월 이력 조회 실패'); }
      }));
      const datasets = new Map();
      async function read(base,file) {
        return file ? parseTracking(await requestWorkbook(base+file.name)) : new Map();
      }
      await pool(keys,async key => {
        const newest = current.get(key);
        const month = newest && previousMonth(newest.date);
        const archive = archives.get(month);
        const available = [...files.filter(file => file.key === key && file.date.startsWith(month)).map(file => ({base:SOURCE,file})),
          ...(archive?.files || []).filter(file => file.key === key && file.date.startsWith(month)).map(file => ({base:archive.base,file}))];
        available.sort((a,b) => b.file.date.localeCompare(a.file.date));
        const prior = available[0];
        const [today,last] = await Promise.allSettled([
          read(SOURCE,newest),
          prior ? read(prior.base,prior.file) : Promise.resolve(new Map())
        ]);
        if (!newest || today.status === 'rejected') notes.push(key+' 현재 파일 조회 불가');
        if (last.status === 'rejected') notes.push(key+' 전월 파일 조회 실패');
        datasets.set(key,{date:today.status === 'fulfilled' ? newest?.date : null,
          live:today.value || new Map(),old:last.value || new Map()});
      });
      model = regions.map(region => {
        const data = datasets.get(region.key);
        const entries = ref.value?.entries.get(region.name) || [];
        const aliases = known[region.name] || [];
        return {...region,date:data.date,items:region.ids.map(id => {
          const live=data.live.get(id), old=data.old.get(id);
          return {id,price:live?.price ?? null,previous:old?.price ?? null,
            info:live?.price != null ? [live.name,live.year,live.units].filter(Boolean).join('/')
              : referenceInfo(id,live,old,entries,aliases)};
        })};
      });
      const all = model.flatMap(region => region.items);
      const priced = all.filter(item => item.price !== null);
      $('#status').text(model.length+'개 지역 · 84㎡ 매매가 '+priced.length+'건 · 전월 비교 '+priced.filter(item => item.previous !== null).length
        +'건 · 가격 없음 '+(all.length-priced.length)+'건'+(ref.value ? ' · 참조 '+ref.value.name : ''));
      $('#notes').text(notes.join(' · '));
      refreshFilters();
    } catch (error) {
      $('#status').text(error.message || '자료 조회 실패');
    } finally { $('#reload').prop('disabled',false); }
  }
  $(document).on('pointerdown',event => {
    if (!$(event.target).closest('.filters').length) $('.filters[open]').prop('open',false);
  }).on('keydown',event => {
    if (event.key !== 'Escape') return;
    const open = $('.filters[open]');
    if (open.length) open.prop('open',false).find('summary').trigger('focus');
  });
  const minInput = $('#min-price')[0], maxInput = $('#max-price')[0];
  function applyRange(min,max) {
    priceRange = {min,max};
    const minLabel = min === null ? '' : numberFormat.format(min)+'억';
    const maxLabel = max === null ? '' : numberFormat.format(max)+'억';
    $('#price-range').text(minLabel || maxLabel ? '('+minLabel+'~'+maxLabel+')' : '(전체)');
    $('#price-filter').prop('open',false).find('summary').trigger('focus');
    render();
  }
  $('#price-form').on('submit',event => {
    event.preventDefault();
    const min = minInput.value === '' ? null : minInput.valueAsNumber;
    const max = maxInput.value === '' ? null : maxInput.valueAsNumber;
    if (min !== null && max !== null && min > max) {
      maxInput.setCustomValidity('최대 매매가는 최소 매매가 이상이어야 합니다.');
      maxInput.reportValidity();
      return;
    }
    applyRange(min,max);
  }).on('reset',() => {
    maxInput.setCustomValidity('');
    applyRange(null,null);
  });
  $('#min-price, #max-price').on('input',() => maxInput.setCustomValidity(''));
  $('#show-missing').on('change',render);
  $('#download').on('click',() => {
    if (!shown.regions.length) return;
    XLSX.writeFile(exportWorkbook(shown.regions,shown.rows),'observer_84.xlsx');
  });
  $('#reload').on('click',load);
  load();
});
</script>
</body>
</html>
